<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotoğraftan Anlatıcı · Reels Stüdyo</title><style>body{margin:0;padding:18px;background:#0c1425;color:#f1f5fa;font:16px system-ui}main{max-width:650px;margin:auto}section{background:#1b2940;padding:18px;border-radius:15px;margin:14px 0}input,button{font:inherit;margin:9px 0}button{padding:12px;border:0;border-radius:10px;background:#a5f6c3;color:#10241a;font-weight:700}video,canvas{width:100%;border-radius:12px}p{line-height:1.5;color:#c9d5e7}a{color:#a5f6c3}</style></head><body><main><a href="./people.html">← Kişi değiştirme</a><h1>Fotoğraftan Video Anlatıcısı</h1><p>Videonun sesini koruyup seçtiğin fotoğrafı ana görüntü yapar. Fotoğraf konuşuyormuş gibi dudak hareketi oluşturmaz; bu işlem için ayrıca bir AI lip-sync modeli gerekir.</p><section><label>1. Konuşmanın bulunduğu video<input id="videoFile" type="file" accept="video/*"></label><video id="source" controls playsinline></video><label>2. Anlatıcı fotoğrafı<input id="photoFile" type="file" accept="image/*"></label><img id="photoPreview" style="width:100%;max-height:350px;object-fit:contain" hidden><p><label><input id="motion" type="checkbox" checked> Hafif kamera hareketi</label></p><button id="create">Fotoğraf anlatıcılı videoyu oluştur</button><p id="status" role="status"></p><video id="output" controls playsinline hidden></video><a id="download" hidden>Videoyu indir</a></section></main><script>
const $=id=>document.getElementById(id),video=$('source');let videoUrl=null,photoUrl=null,photo=new Image(),busy=false;
$('videoFile').onchange=()=>{const f=$('videoFile').files[0];if(!f)return;if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=URL.createObjectURL(f);video.src=videoUrl;video.load()};
$('photoFile').onchange=()=>{const f=$('photoFile').files[0];if(!f)return;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(f);photo.src=photoUrl;$('photoPreview').src=photoUrl;$('photoPreview').hidden=false};
$('create').onclick=async()=>{if(busy)return;if(!video.videoWidth||!Number.isFinite(video.duration)||!video.duration||!photo.complete||!photo.naturalWidth){$('status').textContent='Video ve fotoğraf yükle, ardından videonun açılmasını bekle.';return}if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){$('status').textContent='Bu tarayıcı video oluşturmayı desteklemiyor.';return}const mime=['video/mp4','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){$('status').textContent='Desteklenen kayıt biçimi bulunamadı.';return}busy=true;$('create').disabled=true;let audioContext=null,rec=null,stream=null;try{video.pause();video.currentTime=0;await new Promise(resolve=>{if(video.currentTime===0&&video.readyState>=2)return resolve();video.addEventListener('seeked',resolve,{once:true});setTimeout(resolve,1500)});const canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;const ctx=canvas.getContext('2d');stream=canvas.captureStream(25);let audioAdded=false;try{audioContext=new (window.AudioContext||window.webkitAudioContext)();const src=audioContext.createMediaElementSource(video),dest=audioContext.createMediaStreamDestination();src.connect(dest);for(const track of dest.stream.getAudioTracks()){stream.addTrack(track);audioAdded=true}await audioContext.resume()}catch(e){$('status').textContent='Ses kanalı açılamadı: '+e.message}const chunks=[];rec=new MediaRecorder(stream,{mimeType:mime});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(audioContext)audioContext.close();busy=false;$('create').disabled=false;const blob=new Blob(chunks,{type:mime});if(!blob.size){$('status').textContent='Kayıt boş çıktı.';return}const out=URL.createObjectURL(blob),ext=mime.startsWith('video/mp4')?'mp4':'webm';$('output').src=out;$('output').hidden=false;$('download').href=out;$('download').download='reels-fotograf-anlatici.'+ext;$('download').hidden=false;$('download').textContent='Videoyu indir ('+ext.toUpperCase()+')';$('status').textContent='Tamamlandı. '+(audioAdded?'Orijinal ses eklendi.':'Ses eklenemedi.')+' Dudak senkronizasyonu yapılmadı.'};rec.start(500);const draw=()=>{if(!busy||rec.state!=='recording')return;const w=canvas.width,h=canvas.height,iw=photo.naturalWidth,ih=photo.naturalHeight;const scale=Math.max(w/iw,h/ih)*($('motion').checked?1+.025*video.currentTime/video.duration:1);const dw=iw*scale,dh=ih*scale;ctx.drawImage(photo,(w-dw)/2,(h-dh)/2,dw,dh);$('status').textContent='Oluşturuluyor: %'+Math.min(100,Math.round(video.currentTime/video.duration*100));if(video.ended||video.currentTime>=video.duration-.05){video.pause();rec.stop();return}requestAnimationFrame(draw)};await video.play();requestAnimationFrame(draw)}catch(e){$('status').textContent='İşlem başarısız: '+e.message;busy=false;$('create').disabled=false;if(rec&&rec.state==='recording')rec.stop();else{if(stream)stream.getTracks().forEach(t=>t.stop());if(audioContext)audioContext.close()}}};
</script></body></html>
